<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>VR Virtual Tour</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script>
    (function () {
      var SCENES = {
        '#scene1': 'content-1',
        '#scene2': 'content-2',
        '#scene3': 'content-3'
      };

      // After a portal is used, block further travel until the user has looked away from every portal for LOOK_AWAY_MS
      var LOOK_AWAY_MS = 250;
      var portalLocked = false;   // true while travel is disallowed
      var gazeOnPortal = null;    // the .portal element currently being gazed at, or null
      var gazeLostTime = 0;       // timestamp when gaze left all portals; 0 = still gazing

      function checkPortalLock() {
        if (!portalLocked) { return; }

        if (gazeOnPortal !== null) {
          gazeLostTime = 0;
          return;
        }

        if (gazeLostTime === 0) {
          gazeLostTime = Date.now();
          return;
        }

        if (Date.now() - gazeLostTime > LOOK_AWAY_MS) {
          portalLocked = false;
          gazeLostTime = 0;
          console.log('[VR Tour] Travel lock released — portals are clickable again');
        }
      }
      setInterval(checkPortalLock, 50);

      // Raycaster targeting 
      function refreshRaycaster(groupId) {
        var cursor = document.getElementById('cursor');
        if (!cursor || !cursor.components || !cursor.components.raycaster) {
          console.warn('[VR Tour] Cursor/raycaster not ready');
          return false;
        }

        var group = document.getElementById(groupId);
        if (!group) {
          console.error('[VR Tour] Group element not found:', groupId);
          return false;
        }

        var portalEls = group.querySelectorAll('.portal');
        console.log('[VR Tour] ' + groupId + ' contains ' + portalEls.length + ' .portal element(s)');

        var objects = [];
        for (var i = 0; i < portalEls.length; i++) {
          var el = portalEls[i];
          if (el.object3D) {
            objects.push(el.object3D);
          } else {
            console.warn('[VR Tour] Portal ' + i + ' (' + el.dataset.target + ') has no object3D yet');
          }
        }

        cursor.components.raycaster.objects = objects;
        console.log('[VR Tour] Raycaster set to ' + objects.length + ' Object3D target(s)');
        return objects.length > 0;
      }

      // Scene transition
      function goTo(skyId) {
        // Lock travel as long as the user hasn't looked away from every portal for LOOK_AWAY_MS (checked in checkPortalLock)
        portalLocked = true;
        gazeLostTime = 0;
        console.log('[VR Tour] Travel locked — look away from portals to unlock');

        Object.keys(SCENES).forEach(function (key) {
          document.getElementById(SCENES[key]).setAttribute('visible', false);
        });

        var groupId = SCENES[skyId];
        document.getElementById(groupId).setAttribute('visible', true);
        document.querySelector('#sky').setAttribute('src', skyId);
        refreshRaycaster(groupId);
      }

      // Portal behaviour
      AFRAME.registerComponent('portal', {
        init: function () {
          var self = this;
          var ring = self.el.querySelector('a-ring');
          var hoverState = false;
          var hideTimer = null;

          if (ring) {
            var mat = ring.getAttribute('material') || {};
            self.baseColor = (mat.color !== undefined) ? mat.color : '#ffffff';
            self.baseOpacity = (mat.opacity !== undefined) ? mat.opacity : 1;
          }

          function showHover() {
            // Tell the global lock tracker we're now being gazed at
            gazeOnPortal = self.el;

            if (hideTimer) { clearTimeout(hideTimer); hideTimer = null; }
            if (hoverState) { return; }
            hoverState = true;
            if (ring) {
              ring.setAttribute('material', 'color', '#ffffff');
              ring.setAttribute('material', 'opacity', 1);
            }
            self.el.setAttribute('animation__hover', {
              property: 'scale',
              from: '1 1 1',
              to: '1.12 1.12 1.12',
              dur: 150,
              easing: 'easeOutQuad'
            });
          }

          function hideHover() {
            if (hideTimer) { clearTimeout(hideTimer); }
            hideTimer = setTimeout(function () {
              hideTimer = null;

              // Only clear the global gaze tracker if WE were the last portal being gazed at. If the user moved onto a sibling portal, its showHover
              // already reassigned gazeOnPortal to itself
              if (gazeOnPortal === self.el) {
                gazeOnPortal = null;
              }

              if (!hoverState) { return; }
              hoverState = false;
              if (ring) {
                ring.setAttribute('material', 'color', self.baseColor);
                ring.setAttribute('material', 'opacity', self.baseOpacity);
              }
              self.el.setAttribute('animation__hover', {
                property: 'scale',
                from: '1.12 1.12 1.12',
                to: '1 1 1',
                dur: 150,
                easing: 'easeOutQuad'
              });
            }, 80);
          }

          function onClick(evt) {
            if (portalLocked) {
              // User is still locked (hasn't looked away since last travel)
              return;
            }
            var group = self.el.closest('[id^="content-"]');
            if (group && group.getAttribute('visible') === false) { return; }
            evt.stopPropagation();
            goTo(self.el.dataset.target);
          }

          var children = self.el.querySelectorAll('*');
          for (var i = 0; i < children.length; i++) {
            children[i].addEventListener('mouseenter', showHover);
            children[i].addEventListener('mouseleave', hideHover);
            children[i].addEventListener('click', onClick);
          }
        }
      });

      // Init retry
      window.addEventListener('load', function () {
        var attempts = 0;
        function tryInit() {
          attempts++;
          var cursor = document.getElementById('cursor');
          var group = document.getElementById('content-1');
          if (cursor && cursor.components && cursor.components.raycaster &&
              group && group.querySelector('.portal')) {
            refreshRaycaster('content-1');
          } else if (attempts < 25) {
            setTimeout(tryInit, 200);
          } else {
            console.error('[VR Tour] Init failed after ' + attempts + ' attempts');
          }
        }
        tryInit();
      });
    })();
  </script>
</head>

<body>
  <a-scene>

    <a-assets>
      <img id="scene1" src="assets/abandoned_slipway.jpg">
      <img id="scene2" src="assets/little_paris_eiffel_tower.jpg">
      <img id="scene3" src="assets/the_sky_is_on_fire.jpg">
    </a-assets>

    <a-sky id="sky" src="#scene1"></a-sky>

    <a-entity position="0 1.6 0">
      <a-camera>
        <a-entity id="cursor"
                  cursor="fuse: true; fuseTimeout: 1500"
                  raycaster="autoRefresh: false"
                  geometry="primitive: ring; radiusInner: 0.012; radiusOuter: 0.022"
                  material="color: white; shader: flat"
                  position="0 0 -1">
        </a-entity>
      </a-camera>
    </a-entity>

    
    <!-- SCENE 1 -->
    <a-entity id="content-1" visible="true">

      <!-- Information Plane about the image -->
      <a-entity position="0 2 -3.5">
        <a-plane width="2" height="1"
                 material="shader: flat; color: #111111; opacity: 0.8; transparent: true">
        </a-plane>
        <a-text value="Scene 1 - Abandoned Slipway\n\nA quiet dock where wooden ships were once built and launched, now left to the nature, surrounded by concrete walls and overgrown arboreal vegetation."
                align="center" color="#ffffff" width="1.8" wrap-count="40"
                position="0 0 0.01">
        </a-text>
      </a-entity>

      <!-- Portal 1 - To Scene 2(Little Paris)-->
      <a-entity rotation="0 50 0">
        <a-entity class="portal" portal data-target="#scene2" position="0 2 -3">
          <!-- Clickable invisible plane to detect portal traversal intent -->
          <a-plane width="1.3" height="1.3" position="0 0 -0.05"
                   material="shader: flat; color: #000000; opacity: 0.001; transparent: true">
          </a-plane>
          <a-ring radius-inner="0.35" radius-outer="0.5"
                  material="shader: flat; color: #ff4d88; opacity: 0.85; transparent: true"
                  animation="property: scale; from: 1 1 1; to: 1.08 1.08 1.08; dir: alternate; dur: 900; loop: true; easing: easeInOutSine">
          </a-ring>
          <a-image src="#scene2" width="0.62" height="0.31" position="0 0 0.01"></a-image>
          <a-text value="Scene 2 - Little Paris" align="center" color="#ffffff"
                  width="1.2" position="0 -0.75 0"></a-text>
        </a-entity>
      </a-entity>

      <!-- Portal 2 - To Scene 3(Sky on Fire)-->
      <a-entity rotation="0 -50 0">
        <a-entity class="portal" portal data-target="#scene3" position="0 2 -3">
          <!-- Clickable invisible plane to detect portal traversal intent -->
          <a-plane width="1.3" height="1.3" position="0 0 -0.05"
                   material="shader: flat; color: #000000; opacity: 0.001; transparent: true">
          </a-plane>
          <a-ring radius-inner="0.35" radius-outer="0.5"
                  material="shader: flat; color: #ffa726; opacity: 0.85; transparent: true"
                  animation="property: scale; from: 1 1 1; to: 1.08 1.08 1.08; dir: alternate; dur: 900; loop: true; easing: easeInOutSine">
          </a-ring>
          <a-image src="#scene3" width="0.62" height="0.31" position="0 0 0.01"></a-image>
          <a-text value="Scene 3 - Sky on Fire" align="center" color="#ffffff"
                  width="1.2" position="0 -0.75 0"></a-text>
        </a-entity>
      </a-entity>

    </a-entity>

    
    <!-- SCENE 2 -->
    <a-entity id="content-2" visible="false">

      <!-- Information Plane about the image -->
      <a-entity position="0 2 -3.5">
        <a-plane width="2" height="1"
                 material="shader: flat; color: #111111; opacity: 0.8; transparent: true">
        </a-plane>
        <a-text value="Scene 2 - Little Paris\n\nA miniature Eiffel Tower standing in a small open plaza displaying many garden spots run with willow trees, eucalyptus and a fence completely covered in locks."
                align="center" color="#ffffff" width="1.8" wrap-count="40"
                position="0 0 0.01">
        </a-text>
      </a-entity>

      <!-- Portal 1 - To Scene 1(Abandoned Slipway)-->
      <a-entity rotation="0 50 0">
        <a-entity class="portal" portal data-target="#scene1" position="0 2 -3">
          <!-- Clickable invisible plane to detect portal traversal intent -->
          <a-plane width="1.3" height="1.3" position="0 0 -0.05"
                   material="shader: flat; color: #000000; opacity: 0.001; transparent: true">
          </a-plane>
          <a-ring radius-inner="0.35" radius-outer="0.5"
                  material="shader: flat; color: #00e5ff; opacity: 0.85; transparent: true"
                  animation="property: scale; from: 1 1 1; to: 1.08 1.08 1.08; dir: alternate; dur: 900; loop: true; easing: easeInOutSine">
          </a-ring>
          <a-image src="#scene1" width="0.62" height="0.31" position="0 0 0.01"></a-image>
          <a-text value="Scene 1 - Abandoned Slipway" align="center" color="#ffffff"
                  width="1.2" position="0 -0.75 0"></a-text>
        </a-entity>
      </a-entity>

      <!-- Portal 2 - To Scene 3(Sky on Fire)-->

                  material="shader: flat; color: #ffa726; opacity: 0.85; transparent: true"
                  animation="property: scale; from: 1 1 1; to: 1.08 1.08 1.08; dir: alternate; dur: 900; loop: true; easing: easeInOutSine">
          </a-ring>
          <a-image src="#scene3" width="0.62" height="0.31" position="0 0 0.01"></a-image>
          <a-text value="Scene 3 - Sky on Fire" align="center" color="#ffffff"
                  width="1.2" position="0 -0.75 0"></a-text>
        </a-entity>
      </a-entity>

    </a-entity>

    <!-- SCENE 3 -->
    <a-entity id="content-3" visible="false">

      <!-- Information Plane about the image -->
      <a-entity position="0 2 -3.5">
        <a-plane width="2" height="1"
                 material="shader: flat; color: #111111; opacity: 0.8; transparent: true">
        </a-plane>
        <a-text value="Scene 3 - Sky on Fire\n\nA depiction of a sunset painting the sky and sea in vivid oranges and reds near the costal rocks."
                align="center" color="#ffffff" width="1.8" wrap-count="40"
                position="0 0 0.01">
        </a-text>
      </a-entity>

      <!-- Portal 1 - To Scene 1(Abandoned Slipway)-->
      <a-entity rotation="0 50 0">
        <a-entity class="portal" portal data-target="#scene1" position="0 2 -3">
          <!-- Clickable invisible plane to detect portal traversal intent -->
          <a-plane width="1.3" height="1.3" position="0 0 -0.05"
                   material="shader: flat; color: #000000; opacity: 0.001; transparent: true">
          </a-plane>
          <a-ring radius-inner="0.35" radius-outer="0.5"
                  material="shader: flat; color: #00e5ff; opacity: 0.85; transparent: true"
                  animation="property: scale; from: 1 1 1; to: 1.08 1.08 1.08; dir: alternate; dur: 900; loop: true; easing: easeInOutSine">
          </a-ring>
          <a-image src="#scene1" width="0.62" height="0.31" position="0 0 0.01"></a-image>
          <a-text value="Scene 1 - Abandoned Slipway" align="center" color="#ffffff"
                  width="1.2" position="0 -0.75 0"></a-text>
        </a-entity>
      </a-entity>

      <!-- Portal 2 - To Scene 2(Little Paris)-->
      <a-entity rotation="0 -50 0">
        <a-entity class="portal" portal data-target="#scene2" position="0 2 -3">
          <!-- Clickable invisible plane to detect portal traversal intent -->
          <a-plane width="1.3" height="1.3" position="0 0 -0.05"
                   material="shader: flat; color: #000000; opacity: 0.001; transparent: true">
          </a-plane>
          <a-ring radius-inner="0.35" radius-outer="0.5"
                  material="shader: flat; color: #ff4d88; opacity: 0.85; transparent: true"
                  animation="property: scale; from: 1 1 1; to: 1.08 1.08 1.08; dir: alternate; dur: 900; loop: true; easing: easeInOutSine">
          </a-ring>
          <a-image src="#scene2" width="0.62" height="0.31" position="0 0 0.01"></a-image>
          <a-text value="Scene 2 - Little Paris" align="center" color="#ffffff"
                  width="1.2" position="0 -0.75 0"></a-text>
        </a-entity>
      </a-entity>

    </a-entity>

  </a-scene>
</body>
</html>
